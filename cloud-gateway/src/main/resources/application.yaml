server:
  port: 9090

spring:
  redis:
    data:
      host: redis
      port: 6379
  application:
    name: api-gateway
  config:
    import: configserver:${CONFIG_SERVER_URL:http://localhost:9296}
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: http://order-service-svc
          predicates:
          - Path=/order/**
          filters:
          - name: CircuitBreaker
            args:
              name: order-service
              fallbackUri: forward:/fallback/order-service
          - name: RequestRateLimiter
            args:
              redis-rate-limiter.replenishRate: 1
              redis-rate-limiter.burstCapacity: 1
        - id: product-service
          uri: http://product-service-svc
          predicates:
          - Path=/product/**
          filters:
          - name: CircuitBreaker
            args:
              name: product-service
              fallbackUri: forward:/fallback/product-service
          - name: RequestRateLimiter
            args:
              redis-rate-limiter.replenishRate: 1
              redis-rate-limiter.burstCapacity: 1
        - id: payment-service
          uri: http://payment-service-svc
          predicates:
          - Path=/payment/**
          filters:
          - name: CircuitBreaker
            args:
              name: payment-service
              fallbackUri: forward:/fallback/payment-service
          - name: RequestRateLimiter
            args:
              redis-rate-limiter.replenishRate: 1
              redis-rate-limiter.burstCapacity: 1